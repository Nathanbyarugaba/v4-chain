\* F5: bridging can be disabled (MsgUpdateSafetyParams) during the delay window
\* between acknowledgement and completion. Expect NeverDropped to FAIL: the
\* delayed MsgCompleteBridge fires while disabled, errors, is rolled back and
\* then deleted with no retry -> the user's already-locked funds are
\* permanently frozen (never delivered, never re-acknowledged).
SPECIFICATION Spec
CONSTANTS
    Delay        = 3
    AllowDisable = TRUE
INVARIANTS
    TypeOK
    NeverDropped
PROPERTIES
    EventuallyDelivered
