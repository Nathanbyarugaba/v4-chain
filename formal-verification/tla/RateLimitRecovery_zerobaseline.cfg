\* Forbidden (by LimitParams.Validate) misconfiguration: baseline = 0, so no
\* recovery. Capacity is stuck at 0 and every positive withdrawal is blocked
\* forever. Expect CanWithdrawEventually to FAIL -> this is the permanent freeze
\* that the validation guard (baseline_minimum > 0, baseline_tvl_ppm > 0)
\* specifically prevents.
SPECIFICATION Spec
CONSTANTS
    Baseline       = 0
    RecoverStep    = 0
    WithdrawAmount = 1
INVARIANTS
    TypeOK
PROPERTIES
    CanWithdrawEventually
