\* H3 dust-freeze witness: NoDustFreeze asserts every fully-unlocked, non-empty
\* owner can always redeem a positive amount. This is EXPECTED TO FAIL; the
\* counterexample state shows an owner whose shares (after a vault loss that
\* drove equity below totalShares) floor-divide to a 0 payout for every
\* withdrawable amount -> those shares can never be withdrawn (permanent
\* dust freeze of that holder's position).
SPECIFICATION Spec
CONSTANTS
    Owners     = {o1, o2}
    MaxShares  = 6
    MaxEquity  = 6
    MaxDeposit = 3
INVARIANTS
    NoDustFreeze
