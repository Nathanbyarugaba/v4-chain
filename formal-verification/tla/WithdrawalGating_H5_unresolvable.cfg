\* H5 (crown jewel): a negative-TNC subaccount that CANNOT be resolved
\* (CanResolve = FALSE) -- e.g. no opposite-side counterparties to deleverage
\* against and an empty insurance fund. The clob EndBlock re-arms the breaker
\* every block, so:
\*   - WhileActiveBlocked HOLDS (funds blocked in every reachable state), and
\*   - EventuallyUnblocked FAILS (withdrawals never re-open) => PERMANENT FREEZE.
SPECIFICATION Spec
CONSTANTS
    SeenBlocks   = 50
    CanResolve   = FALSE
    AllowRegress = FALSE
INVARIANTS
    TypeOK
    WhileActiveBlocked
PROPERTIES
    EventuallyUnblocked
