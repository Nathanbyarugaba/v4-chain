\* H1: allow block-height REGRESSION (chain restart from an older snapshot /
\* a bad upgrade that lowers the height). Expect SafetyNoPanic to FAIL with a
\* counterexample: a persisted "seen" height ends up in the future relative to
\* the current block, so every Withdrawal/Transfer hits the keeper panic guard
\* -> the entire withdrawal/transfer path is permanently frozen.
SPECIFICATION Spec
CONSTANTS
    SeenBlocks   = 50
    CanResolve   = TRUE
    AllowRegress = TRUE
INVARIANTS
    TypeOK
    SafetyNoPanic
